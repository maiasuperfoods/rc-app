# Shopify app configuration for Renaissance Commerce.
#
# This file is the source of truth for the app's URLs, scopes and webhook subscriptions. Push it
# with `shopify app deploy` (see SHOPIFY.md). Editing the same fields in the Dev Dashboard works
# until the next deploy, which overwrites them from here — so change them here.
#
# client_id is the app's public identifier, not a secret. The client secret lives only in Vercel
# as SHOPIFY_CLIENT_SECRET and must never appear in this file.

client_id = "7d43cd3486d04d91fa6f682990d3633e"
name = "Renaissance Commerce inc."
handle = "renaissance-commerce"
application_url = "https://app.renaissancecommerce.com"

# The app renders inside the Shopify admin. src/proxy.ts serves /shopify/embedded for any load
# carrying embedded=1 and sets frame-ancestors for that store; the dashboards themselves open in a
# full window. Turning this off would also mean dropping App Bridge from /shopify/embedded.
embedded = true

[access_scopes]
# Read-only, and the smallest set that produces the dashboards. read_all_orders is needed for
# lifetime-value cohorts, which look further back than the 60 days read_orders covers.
# read_customers is used only for `order.customer { id, numberOfOrders }` — no customer PII is
# requested, received or stored. read_locations was deliberately dropped: inventory levels are
# summed without reading the location. Keep in step with SHOPIFY_SCOPE_LIST in
# src/lib/integrations/shopify.ts.
scopes = "read_orders,read_all_orders,read_products,read_inventory,read_customers"

[auth]
redirect_urls = [ "https://app.renaissancecommerce.com/api/integrations/shopify/callback" ]

[webhooks]
# Latest stable. 2025-10 became inaccessible on 16 Oct 2026. Keep in step with API_VERSION in
# src/lib/integrations/shopify.ts.
api_version = "2026-10"

  # One endpoint handles all four topics. It verifies X-Shopify-Hmac-Sha256 before any side effect,
  # returns 401 on a bad or missing signature, and 503 on a failed erasure so Shopify retries
  # rather than assuming the data is gone. See src/app/api/webhooks/shopify/route.ts.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/api/webhooks/shopify"

[pos]
embedded = false

[build]
# Never let a local `shopify app dev` rewrite application_url in this file and push a tunnel URL
# to the production app.
automatically_update_urls_on_dev = false
